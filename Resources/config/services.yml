parameters:
    practo_mds.constant_rpc.class: Practo\MDS\Config\Constant
    practo_mds.country_rpc.class: Practo\MDS\RPC\CountryClient
    practo_mds.unitofmeasure_rpc.class: Practo\MDS\RPC\UnitOfMeasureClient
    practo_mds.systemofmedicine_rpc.class: Practo\MDS\RPC\SystemOfMedicineClient
    practo_mds.specialization_rpc.class: Practo\MDS\RPC\SpecializationClient
    practo_mds.routeofadministration_rpc.class: Practo\MDS\RPC\RouteOfAdministrationClient
    practo_mds.drugregulatoryclassification_rpc.class: Practo\MDS\RPC\DrugRegulatoryClassificationClient
    practo_mds.drugproduct_rpc.class: Practo\MDS\RPC\DrugProductClient
    practo_mds.drugmanufacturer_rpc.class: Practo\MDS\RPC\DrugManufacturerClient
    practo_mds.drugcombination_rpc.class: Practo\MDS\RPC\DrugCombinationClient
    practo_mds.drugbrand_rpc.class: Practo\MDS\RPC\DrugBrandClient
    practo_mds.dosageform_rpc.class: Practo\MDS\RPC\DosageFormClient
    practo_mds.api_rpc.class: Practo\MDS\RPC\APIClient
    practo_mds.apiclassification_rpc.class: Practo\MDS\RPC\APIClassificationClient


    practo_mds.base_uri: %mds.base_uri%
    practo_mds.rpc.secret: %mds.rpc.secret%
    practo_mds.source: %mds.source%


    practo_mds.metadata_call_back: { update_metadata : 'Practo\MDS\Utility\AuthUtility::attachHeaders', credentials : null }


services:

  practo_mds_grpc.constant:
    class: %practo_mds.constant_rpc.class%
    arguments:
      - %mds.source%
      - %mds.rpc.secret%

  practo_mds_grpc.channel:
    class: Grpc\Channel
    arguments:
      - %practo_mds.base_uri%
      - {credentials : null }

  practo_mds.country_rpc:
    class: %practo_mds.country_rpc.class%
    arguments:
      - %practo_mds.base_uri%
      - %practo_mds.metadata_call_back%
      - '@practo_mds_grpc.channel'

  practo_mds.unitofmeasure_rpc:
    class: %practo_mds.unitofmeasure_rpc.class%
    arguments:
      - %practo_mds.base_uri%
      - {update_metadata : 'Practo\MDS\Utility\AuthUtility::attachHeaders', credentials : null}
      - '@practo_mds_grpc.channel'

  practo_mds.systemofmedicine_rpc:
    class: %practo_mds.systemofmedicine_rpc.class%
    arguments:
      - %practo_mds.base_uri%
      - {update_metadata : 'Practo\MDS\Utility\AuthUtility::attachHeaders', credentials : null}
      - '@practo_mds_grpc.channel'

  practo_mds.specialization_rpc:
    class: %practo_mds.specialization_rpc.class%
    arguments:
      - %practo_mds.base_uri%
      - {update_metadata : 'Practo\MDS\Utility\AuthUtility::attachHeaders', credentials : null}
      - '@practo_mds_grpc.channel'

  practo_mds.routeofadministration_rpc:
    class: %practo_mds.routeofadministration_rpc.class%
    arguments:
      - %practo_mds.base_uri%
      - {update_metadata : 'Practo\MDS\Utility\AuthUtility::attachHeaders', credentials : null}
      - '@practo_mds_grpc.channel'

  practo_mds.drugregulatoryclassification_rpc:
    class: %practo_mds.drugregulatoryclassification_rpc.class%
    arguments:
      - %practo_mds.base_uri%
      - {update_metadata : 'Practo\MDS\Utility\AuthUtility::attachHeaders', credentials : null}
      - '@practo_mds_grpc.channel'

  practo_mds.drugproduct_rpc:
    class: %practo_mds.drugproduct_rpc.class%
    arguments:
      - %practo_mds.base_uri%
      - {update_metadata : 'Practo\MDS\Utility\AuthUtility::attachHeaders', credentials : null}
      - '@practo_mds_grpc.channel'

  practo_mds.drugmanufacturer_rpc:
    class: %practo_mds.drugmanufacturer_rpc.class%
    arguments:
      - %practo_mds.base_uri%
      - {update_metadata : 'Practo\MDS\Utility\AuthUtility::attachHeaders', credentials : null}
      - '@practo_mds_grpc.channel'

  practo_mds.drugcombination_rpc:
    class: %practo_mds.drugcombination_rpc.class%
    arguments:
      - %practo_mds.base_uri%
      - {update_metadata : 'Practo\MDS\Utility\AuthUtility::attachHeaders', credentials : null}
      - '@practo_mds_grpc.channel'


  practo_mds.drugbrand_rpc:
    class: %practo_mds.drugbrand_rpc.class%
    arguments:
      - %practo_mds.base_uri%
      - {update_metadata : 'Practo\MDS\Utility\AuthUtility::attachHeaders', credentials : null}
      - '@practo_mds_grpc.channel'


  practo_mds.dosageform_rpc:
    class: %practo_mds.dosageform_rpc.class%
    arguments:
      - %practo_mds.base_uri%
      - {update_metadata : 'Practo\MDS\Utility\AuthUtility::attachHeaders', credentials : null}
      - '@practo_mds_grpc.channel'

  practo_mds.api_rpc:
    class: %practo_mds.api_rpc.class%
    arguments:
      - %practo_mds.base_uri%
      - {update_metadata : 'Practo\MDS\Utility\AuthUtility::attachHeaders', credentials : null}
      - '@practo_mds_grpc.channel'

  practo_mds.apiclassification_rpc:
    class: %practo_mds.apiclassification_rpc.class%
    arguments:
      - %practo_mds.base_uri%
      - {update_metadata : 'Practo\MDS\Utility\AuthUtility::attachHeaders', credentials : null}
      - '@practo_mds_grpc.channel'

